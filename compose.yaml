services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    logging: &bounded-logs
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logs

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1"
      AI_SERVICE_URL: http://ai-service:8000
      ALLOWED_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-240000}
      JSON_BODY_LIMIT: 128kb
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logs
    depends_on:
      ai-service:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
    restart: unless-stopped
    environment:
      APP_ENV: production
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: lax
      DATABASE_PATH: /data/db/scholarship.db
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_FILES_PER_APPLICATION: "8"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?Set private OLLAMA_BASE_URL in .env.production}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - scholarship_db:/data/db
      - scholarship_uploads:/data/uploads
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  caddy_data:
  caddy_config:
  scholarship_db:
  scholarship_uploads:
